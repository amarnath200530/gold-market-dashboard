name: Daily Gold Market Dashboard

on:
  schedule:
    - cron: '0 12 * * 1-5'   # Runs weekdays at 12:00 UTC
  workflow_dispatch:          # Allows manual trigger from GitHub UI

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run dashboard script
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python dashboard.py

      - name: Commit and push results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/latest_report.md
          git commit -m "Update gold market dashboard [skip ci]" || echo "No changes to commit"
          git push
